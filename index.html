<title>Our Little World</title>
<style>
/* Our Little World — the phone build.
 *
 * One screen, landscape, thumbs on the glass. Nothing here scrolls, zooms,
 * selects or bounces: a page that behaves like a page does not feel like a
 * game.
 *
 * Every colour below is lifted from the game's own tileset palette in
 * tools/make_tileset.py — the road, the kerb, the shingle roof, the white of
 * the road markings, and the grass. The chrome is made of the same material as
 * the world it frames rather than a set of greys chosen separately. The one
 * accent is grass green against road grey, which is what the game mostly is.
 *
 * Lettering is the game's own 5x7 bitmap font, drawn to canvas by
 * web/src/pixelfont.js. The system sans appears only in genuine small print.
 *
 * The desktop preview keeps its own look in style.css.
 */

:root {
  --night:   #16181c;   /* one step below the charcoal roof tile */
  --panel:   #23262c;   /* UI frames */
  --asphalt: #3a3a3e;   /* palette 10, shingle roof and garage door */
  --kerb:    #56565c;   /* palette 9, road dark */
  --trim:    #ecece8;   /* palette 11, white trim and road markings */
  --muted:   #8b8d92;
  --verge:   #567c40;   /* palette 1, grass */
  --verge-lit: #68924e; /* palette 2, grass light */

  /* Keep clear of rounded corners and the home indicator. */
  --inset-left: max(14px, env(safe-area-inset-left));
  --inset-right: max(14px, env(safe-area-inset-right));
  --inset-bottom: max(12px, env(safe-area-inset-bottom));
  --inset-top: max(10px, env(safe-area-inset-top));
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: var(--night);
  overscroll-behavior: none;
}

body {
  position: fixed;
  inset: 0;
  color: var(--trim);
  font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  /* No scrolling, no pinch, no double-tap zoom, no text selection, no blue
     flash when a thumb lands. All of those read as "web page", not "game". */
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

/* Every canvas on the page holds pixel art, including the lettering. */
canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

:focus-visible {
  outline: 3px solid var(--verge-lit);
  outline-offset: 3px;
}

/* ---- the screen ------------------------------------------------------- */

#stage {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

#screen {
  height: 100%;
  width: auto;
  max-width: 100%;
  max-height: 100%;
}

/* ---- contextual prompt ------------------------------------------------ */

/* Shaped like the name plates that float over characters in the game: a dark
   plate, white lettering, a hard edge. Floating labels look like this here. */
#hint {
  position: absolute;
  top: var(--inset-top);
  left: 50%;
  transform: translateX(-50%);
  padding: 6px 12px;
  background: rgba(22, 24, 28, 0.86);
  border: 2px solid var(--kerb);
  pointer-events: none;
}

#hint[hidden] { display: none; }

/* ---- controls --------------------------------------------------------- */

#hud {
  position: absolute;
  inset: 0;
  pointer-events: none;   /* only the controls themselves take touches */
}

#pad, #buttons {
  position: absolute;
  bottom: var(--inset-bottom);
  pointer-events: auto;
}

#pad {
  left: var(--inset-left);
  display: grid;
  place-items: center;
  width: 136px;
  height: 136px;
  border-radius: 50%;
  background: var(--asphalt);
  border: 3px solid var(--kerb);
  transition: background 110ms ease, border-color 110ms ease;
}

#pad.active {
  background: #2f3a2c;          /* asphalt warmed towards the verge */
  border-color: var(--verge);
}

.knob {
  grid-area: 1 / 1;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: var(--trim);
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
  pointer-events: none;
  will-change: transform;
}

#buttons {
  right: var(--inset-right);
  display: flex;
  align-items: flex-end;
  gap: 12px;
}

.btn {
  display: grid;
  place-items: center;
  padding: 0;
  border-radius: 50%;
  border: 3px solid var(--kerb);
  background: var(--asphalt);
  /* A hard offset shadow rather than a blurred one — the whole game is drawn
     on a pixel grid, and a soft glow would be the only thing on screen that
     is not. */
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.4);
  transition: background 90ms ease, transform 90ms ease, box-shadow 90ms ease;
}

.btn.active {
  background: var(--verge);
  border-color: var(--verge-lit);
  transform: translateY(3px);
  box-shadow: 0 0 0 rgba(0, 0, 0, 0.4);
}

.btn.large  { width: 86px; height: 86px; }
.btn.medium { width: 68px; height: 68px; }
.btn.small  { width: 54px; height: 54px; margin-bottom: 22px; }

/* A control that would do nothing right now fades rather than vanishing, so
   the layout never jumps under a thumb already reaching for it. */
.btn[disabled] { opacity: 0.3; }

/* ---- the destination list --------------------------------------------- */

#menu {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(11, 12, 15, 0.72);
}

#menu[hidden] { display: none; }

#menu .panel {
  width: min(360px, 80vw);
  padding: 16px;
  background: var(--panel);
  border: 3px solid var(--kerb);
  box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.45);
}

.plate-title { margin-bottom: 12px; padding-left: 2px; }

#menu ul {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 0;
  padding: 0;
  list-style: none;
}

#menu li {
  padding: 13px 12px;
  border: 2px solid transparent;
  cursor: pointer;
}

/* The highlight follows both the pad and the last thing touched, so the list
   works the same whether you steer it or tap it. */
#menu li.on {
  background: var(--verge);
  border-color: var(--verge-lit);
}

/* ---- overlays --------------------------------------------------------- */

#rotate, #boot {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  text-align: center;
  padding: 24px;
  background: var(--night);
}

#rotate[hidden], #boot[hidden] { display: none; }

/* A phone rotating a quarter turn, drawn in CSS so the page stays one file. */
.phone {
  width: 44px;
  height: 72px;
  margin-bottom: 20px;
  border: 3px solid var(--muted);
  border-radius: 8px;
  animation: turn 2.4s ease-in-out infinite;
}

@keyframes turn {
  0%, 32%   { transform: rotate(0deg); }
  62%, 100% { transform: rotate(-90deg); }
}

/* The card is just the name and the button now. */
#title { margin-bottom: 30px; }

#start {
  display: grid;
  place-items: center;
  min-width: 190px;
  padding: 15px 34px;
  border: 3px solid var(--verge-lit);
  background: var(--verge);
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.4);
  cursor: pointer;
}

#start:active {
  transform: translateY(4px);
  box-shadow: 0 0 0 rgba(0, 0, 0, 0.4);
}

#start:disabled {
  background: var(--asphalt);
  border-color: var(--kerb);
  cursor: default;
  transform: none;
}

#failure {
  position: absolute;
  inset: auto 16px 16px;
  margin: 0;
  padding: 12px 14px;
  background: #3a1f1f;
  border: 2px solid #7a4040;
  color: #f0c0c0;
  font: 12px/1.5 ui-monospace, monospace;
}

#failure[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) {
  .phone { animation: none; transform: rotate(-90deg); }
  #pad, .btn, #start { transition: none; }
}

</style>
</head>
<body>

<div id="stage">
  <canvas id="screen" width="256" height="192"></canvas>
</div>

<div id="hint" hidden></div>

<div id="hud">
  <div id="pad" data-pad><span class="knob" data-knob></span></div>
  <div id="buttons">
    <button class="btn small" data-button="x" aria-label="Where to"></button>
    <button class="btn medium" data-button="b" aria-label="Back"></button>
    <button class="btn large" data-button="a" aria-label="Action"></button>
  </div>
</div>

<div id="menu" hidden>
  <div class="panel">
    <div id="menu-title" class="plate-title"></div>
    <ul id="menu-list"></ul>
  </div>
</div>

<div id="rotate" hidden>
  <span class="phone"></span>
  <div id="rotate-text"></div>
</div>

<div id="boot">
  <div id="title"></div>
  <button id="start"></button>
</div>

<p id="failure" hidden></p>

<script>
// ---- web/src/assets.js ---------------------------------------------
// Getting at the contents of content/ and assets/game/.
//
// Two ways in, and the game does not care which:
//
//   1. Served by tools/dev-server.js, which hands out the project root, so a
//      repo-relative path can just be fetched.
//   2. Baked into one HTML file by tools/build-web.js, which drops every JSON
//      file and every PNG into `globalThis.__OLW_ASSETS` as text and data URIs.
//      That build is what goes on a link for the phone: one file, no server,
//      nothing to go missing.
//
// Paths are always repo-relative — "content/maps/forest-fountain.json" — so
// the same string works in both worlds and matches what the map files contain.

const bundle = globalThis.__OLW_ASSETS ?? null;

/** True when running from the single-file build rather than the dev server. */
const isBundled = bundle !== null;

// Pages live in web/, so the project root is one level up.
const BASE = '../';

async function loadJSON(path) {
  if (bundle) {
    const text = bundle[path];
    if (text === undefined) throw new Error(`${path} is not in the bundle`);
    return JSON.parse(text);
  }
  const res = await fetch(BASE + path);
  if (!res.ok) throw new Error(`Could not load ${path} (HTTP ${res.status})`);
  return res.json();
}

function loadImage(path) {
  const src = bundle ? bundle[path] : BASE + path;
  if (src === undefined) return Promise.reject(new Error(`${path} is not in the bundle`));
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(`Could not load image ${path}`));
    img.src = src;
  });
}

// ---- web/src/collision.js ------------------------------------------
// Collision rules, shared by everything in the preview.
//
// These mirror the C in source/main.c. The DS cannot run this code, so the two
// implementations are kept deliberately small and identical in behaviour. If
// you change a rule here, change it there too.

/** Movement vectors per facing name, in the order the sheets are laid out. */
const DIRECTIONS = {
  down: [0, 1],
  up: [0, -1],
  left: [-1, 0],
  right: [1, 0],
};

/**
 * Is the map cell covering this pixel solid? Off-map counts as solid.
 *
 * Solidity is per cell rather than per tile index, because an interior is one
 * painted picture: the same tile can be floor in one room and furniture in
 * another. mapdata.js flattens both rules into map.solidGrid.
 */
function tileSolidAt(map, px, py) {
  if (px < 0 || py < 0) return true;
  const tx = Math.floor(px / map.tileSize);
  const ty = Math.floor(py / map.tileSize);
  if (tx >= map.width || ty >= map.height) return true;
  return map.solidGrid[ty][tx] === 1;
}

function overlaps(a, b) {
  return a.x < b.x + b.width && a.x + a.width > b.x
      && a.y < b.y + b.height && a.y + a.height > b.y;
}

/** World-space collision box of an actor, optionally at a hypothetical spot. */
function actorBox(actor, sheets, atX = actor.x, atY = actor.y) {
  const box = sheets[actor.sprite].collisionBox;
  return {
    x: Math.round(atX) + box.x,
    y: Math.round(atY) + box.y,
    width: box.width,
    height: box.height,
  };
}

/** Grow a box outwards, for "am I close enough to interact?" tests. */
function inflate(box, by) {
  return {
    x: box.x - by,
    y: box.y - by,
    width: box.width + by * 2,
    height: box.height + by * 2,
  };
}

function boxesOverlap(a, b) {
  return overlaps(a, b);
}

/**
 * Can this collision box sit here?
 *
 * Only the small box at the feet is tested, never the whole sprite, so a
 * character's head can overlap the top of a hedge the way it does in DS RPGs.
 * `ignore` holds actors that should not block — yourself, and any vehicle you
 * happen to be sitting inside.
 */
function canStand(map, sheets, box, actors = [], ignore = []) {
  // Four corners is enough while the box stays smaller than one tile.
  const corners = [
    [box.x, box.y],
    [box.x + box.width - 1, box.y],
    [box.x, box.y + box.height - 1],
    [box.x + box.width - 1, box.y + box.height - 1],
  ];
  if (corners.some(([px, py]) => tileSolidAt(map, px, py))) return false;

  for (const other of actors) {
    if (!other.solid || other.hidden || ignore.includes(other)) continue;
    if (overlaps(box, actorBox(other, sheets))) return false;
  }
  return true;
}

// ---- web/src/mapdata.js --------------------------------------------
// Turning a map file into something playable.
//
// Kept free of any browser or rendering code so the same functions can run in
// a plain Node harness. Mirrors decode_tiles() and expand_stamps() in
// tools/pack_content.py.

/** Maps store tiles as rows of characters for legibility; expand to indices. */
function decodeTiles(map) {
  if (typeof map.tiles[0] !== 'string') return map.tiles;
  return map.tiles.map((row) => [...row].map((ch) => map.tileChars[ch]));
}

/**
 * Paste artwork tile-blocks into the map grid.
 *
 * A stamp names one painted image that tools/make_tileset.py has sliced into a
 * rectangle of tiles — `building` for a house seen from outside, `interior`
 * for a room seen from above. Writing a hundred tile indices by hand into a
 * map would be unreadable, so maps just name the block and a corner.
 *
 * A building's tiles all become solid except the bottom rows it declares
 * walkable — the driveway and lawn baked into the artwork. An interior says
 * nothing about solidity; its map draws a `collision` grid instead, because
 * furniture does not line up with any rule about rows.
 *
 * `loadJSON` takes a repo-relative path and returns the parsed file, so this
 * works with fetch in the browser and with the filesystem in tests.
 */
async function expandStamps(map, loadJSON) {
  const solid = new Set(map.solidTiles ?? []);

  for (const stamp of map.stamps ?? []) {
    const kind = 'interior' in stamp ? 'interior' : 'building';
    const name = stamp[kind];
    const b = await loadJSON(`content/${kind}s/${name}.json`);
    const { widthTiles: w, heightTiles: h, firstTile: first } = b;
    const walkable = kind === 'building' ? (b.walkableBottomRows ?? 0) : h;

    if (stamp.x < 0 || stamp.y < 0
        || stamp.x + w > map.width || stamp.y + h > map.height) {
      throw new Error(
        `${kind} "${name}" (${w}x${h}) at (${stamp.x},${stamp.y}) `
        + `does not fit in ${map.width}x${map.height}`);
    }

    for (let dy = 0; dy < h; dy++) {
      for (let dx = 0; dx < w; dx++) {
        const index = first + dy * w + dx;
        map.tiles[stamp.y + dy][stamp.x + dx] = index;
        if (dy < h - walkable) solid.add(index);
      }
    }
  }

  map.solidTiles = [...solid];
  return map;
}

/**
 * Flatten solidity down to one flag per map cell.
 *
 * Two things decide whether a cell blocks: the kind of tile drawn there (a
 * hedge is always a hedge) and, for maps built from a single painted image, a
 * hand-drawn `collision` grid — because a sofa and the floor it stands on are
 * both just 'pixels from the same picture' to the tileset.
 *
 * Mirrors build_solid_grid() in tools/pack_content.py.
 */
function buildSolidGrid(map) {
  const solid = new Set(map.solidTiles ?? []);
  const grid = map.tiles.map((row) => row.map((t) => (solid.has(t) ? 1 : 0)));

  const rows = map.collision;
  if (rows) {
    if (rows.length !== map.height || rows.some((r) => r.length !== map.width)) {
      throw new Error(
        `Map ${map.id}: collision grid is not ${map.width}x${map.height}`);
    }
    rows.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch !== '#' && ch !== '.') {
        throw new Error(
          `Map ${map.id}: collision row ${y} has "${ch}"; `
          + 'only "#" (blocked) and "." (open) are allowed');
      }
      grid[y][x] = ch === '#' ? 1 : 0;
    }));
  }

  map.solidGrid = grid;
  return grid;
}

/**
 * Rasterise the drive zones into one flag per cell, or null if the map has
 * none and vehicles may go anywhere.
 *
 * A grid rather than a list of rectangles, because a car is four tiles long:
 * driving off the driveway and onto the road means straddling two zones at
 * once, and "is this box inside any single rectangle" says no to that. A grid
 * handles the union for free, and costs the same as the collision test right
 * beside it.
 *
 * Mirrors build_drive_grid() in tools/pack_content.py.
 */
function buildDriveGrid(map) {
  const zones = map.driveZones ?? [];
  if (!zones.length) {
    map.driveGrid = null;
    return null;
  }
  const grid = Array.from({ length: map.height }, () => new Array(map.width).fill(0));
  for (const r of zones) {
    for (let y = r.y; y < r.y + r.height; y++) {
      for (let x = r.x; x < r.x + r.width; x++) grid[y][x] = 1;
    }
  }
  map.driveGrid = grid;
  return grid;
}

/** Everything a map needs before it can be played. */
async function prepareMap(map, loadJSON) {
  map.tiles = decodeTiles(map);
  await expandStamps(map, loadJSON);
  buildSolidGrid(map);
  buildDriveGrid(map);
  return map;
}

/** Is this pixel inside any of these tile rectangles? */
function inRects(map, rects, box) {
  const t = map.tileSize;
  return rects.some((r) => box.x >= r.x * t
                        && box.y >= r.y * t
                        && box.x + box.width <= (r.x + r.width) * t
                        && box.y + box.height <= (r.y + r.height) * t);
}

// ---- web/src/actors.js ---------------------------------------------
// Everything that lives on a map and can move: the player, wandering pets, and
// vehicles. Mirrored in source/main.c.



const WALK_SPEED = 1.2;                        // Maia, pixels per frame
const DIAG_SPEED = WALK_SPEED * Math.SQRT1_2;  // so diagonals aren't faster
const DRIVE_SPEED = 2.6;                       // Frankie
const WANDER_SPEED = 0.5;                      // pets amble

const TICKS_PER_STEP = 8;    // animation frames held per pose
const DRIVE_TICKS_PER_STEP = 4;

const DIR_NAMES = Object.keys(DIRECTIONS);

// How long a pet walks in one direction, and how long it rests, in frames.
const WANDER_WALK = [40, 110];
const WANDER_REST = [50, 200];

function randRange([lo, hi]) {
  return lo + Math.floor(Math.random() * (hi - lo + 1));
}

function makeActor(spec, sheets) {
  const meta = sheets[spec.sprite];
  const resting = spec.frame ?? meta.frameOrder[0];
  return {
    id: spec.id,
    sprite: spec.sprite,
    category: spec.category,
    x: spec.x,
    y: spec.y,
    homeX: spec.x,
    homeY: spec.y,
    solid: Boolean(spec.solid),
    behavior: spec.behavior ?? 'static',
    wanderRadius: spec.wanderRadius ?? 0,
    // Static objects just show whatever frame the map asked for.
    facing: resting.split('_')[0],
    restPose: resting.slice(resting.indexOf('_') + 1),
    cyclePos: 0,
    tick: 0,
    moving: false,
    timer: randRange(WANDER_REST),
    hidden: false,
  };
}

/** Which frame of its sheet an actor should be showing right now. */
function frameNameFor(actor, sheets) {
  const meta = sheets[actor.sprite];
  if (!actor.moving) {
    // Everything settles on its first pose when stopped: "idle" for a
    // character, "parked" for a vehicle.
    const rest = `${actor.facing}_${meta.poses[0]}`;
    return meta.frameOrder.includes(rest) ? rest : `${actor.facing}_${actor.restPose}`;
  }
  const pose = meta.walkCycle[actor.cyclePos % meta.walkCycle.length];
  const name = `${actor.facing}_${pose}`;
  return meta.frameOrder.includes(name) ? name : meta.frameOrder[0];
}

function advanceAnimation(actor, sheets, ticksPerStep) {
  const meta = sheets[actor.sprite];
  actor.tick += 1;
  if (actor.tick >= ticksPerStep) {
    actor.tick = 0;
    actor.cyclePos = (actor.cyclePos + 1) % meta.walkCycle.length;
  }
}

/**
 * Where a vehicle is allowed to be.
 *
 * A car is not a person: it belongs on the driveway and the road, and looks
 * absurd parked on a lawn or nosing between two houses. Rather than making
 * every patch of grass solid — which would trap Maia on foot too — a map marks
 * the cells a vehicle may occupy, and everything else is off limits to
 * vehicles only. A map with no drive grid lets them go anywhere.
 *
 * Every cell the car covers is tested, not just the corners: Frankie's
 * footprint is four tiles wide, so corners alone would let her bridge a gap.
 *
 * Mirrors can_drive() in source/main.c.
 */
function canDrive(map, box) {
  const grid = map.driveGrid;
  if (!grid) return true;
  if (box.x < 0 || box.y < 0) return false;

  const t = map.tileSize;
  const x1 = Math.floor((box.x + box.width - 1) / t);
  const y1 = Math.floor((box.y + box.height - 1) / t);
  if (x1 >= map.width || y1 >= map.height) return false;

  for (let ty = Math.floor(box.y / t); ty <= y1; ty++) {
    for (let tx = Math.floor(box.x / t); tx <= x1; tx++) {
      if (!grid[ty][tx]) return false;
    }
  }
  return true;
}

/**
 * Move an actor, resolving each axis separately so that sliding along a wall
 * works instead of stopping dead. Returns which axes were blocked.
 *
 * `confined` marks a vehicle, which additionally has to stay on a drivable
 * surface.
 */
function moveActor(actor, dx, dy, speed, map, sheets, actors, ignore,
                          confined = false) {
  const allowed = (box) => canStand(map, sheets, box, actors, ignore)
                        && (!confined || canDrive(map, box));
  const blocked = { x: false, y: false };
  if (dx !== 0) {
    const nx = actor.x + dx * speed;
    if (allowed(actorBox(actor, sheets, nx, actor.y))) {
      actor.x = nx;
    } else {
      blocked.x = true;
    }
  }
  if (dy !== 0) {
    const ny = actor.y + dy * speed;
    if (allowed(actorBox(actor, sheets, actor.x, ny))) {
      actor.y = ny;
    } else {
      blocked.y = true;
    }
  }
  return blocked;
}

/**
 * Idle pets: amble in one direction for a while, rest, repeat, staying within
 * wanderRadius of where the map placed them.
 *
 * The DS runs the same logic with its own random number generator, so the pets
 * will not take identical paths on both platforms. Only the behaviour matches.
 */
function updateWander(actor, map, sheets, actors) {
  if (actor.moving) {
    const [dx, dy] = DIRECTIONS[actor.facing];
    const nx = actor.x + dx * WANDER_SPEED;
    const ny = actor.y + dy * WANDER_SPEED;

    const strayed = Math.hypot(nx - actor.homeX, ny - actor.homeY) > actor.wanderRadius;
    const blocked = strayed
      || !canStand(map, sheets, actorBox(actor, sheets, nx, ny), actors, [actor]);

    if (blocked) {
      // Turn around rather than standing there pushing into it.
      actor.moving = false;
      actor.timer = randRange(WANDER_REST);
    } else {
      actor.x = nx;
      actor.y = ny;
      advanceAnimation(actor, sheets, TICKS_PER_STEP);
      if (--actor.timer <= 0) {
        actor.moving = false;
        actor.timer = randRange(WANDER_REST);
      }
    }
  } else {
    actor.tick = 0;
    actor.cyclePos = 0;
    if (--actor.timer <= 0) {
      actor.facing = DIR_NAMES[Math.floor(Math.random() * DIR_NAMES.length)];
      actor.moving = true;
      actor.timer = randRange(WANDER_WALK);
    }
  }
}

// ---- web/src/input.js ----------------------------------------------
// Maps the keyboard — and the phone's on-screen pad — onto the DS button set.
//
// The rest of the game only ever asks "is BUTTON down?", never "is key X down?"
// or "where is the thumb?", so the DS build, the desktop preview and the touch
// build all share one set of input concepts. touch.js feeds the same buttons
// through pressButton()/releaseButton().

const KEY_MAP = {
  ArrowUp: 'up',    KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down',
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  KeyZ: 'a', KeyJ: 'a',
  KeyX: 'b', KeyK: 'b',
  KeyI: 'x',   // the key melonDS binds to X
  Enter: 'start',
  ShiftLeft: 'select', ShiftRight: 'select',
};

const held = new Set();
const pressedThisFrame = new Set();

function initInput(target = window) {
  target.addEventListener('keydown', (e) => {
    const button = KEY_MAP[e.code];
    if (!button) return;
    e.preventDefault();
    if (!held.has(button)) pressedThisFrame.add(button);
    held.add(button);
  });

  target.addEventListener('keyup', (e) => {
    const button = KEY_MAP[e.code];
    if (!button) return;
    e.preventDefault();
    held.delete(button);
  });

  // Releasing focus shouldn't leave the player walking forever.
  target.addEventListener('blur', () => held.clear());
}

/**
 * Push a button from something that is not the keyboard.
 *
 * The on-screen pad calls these; so does tapping a menu row, which presses A
 * rather than reaching into the game state, so touch and keys travel the exact
 * same path and cannot drift apart.
 */
function pressButton(button) {
  if (!held.has(button)) pressedThisFrame.add(button);
  held.add(button);
}

function releaseButton(button) {
  held.delete(button);
}

/** Let go of everything — used when a touch is cancelled or focus is lost. */
function releaseAll() {
  held.clear();
}

/** True for as long as the button is down. */
function isHeld(button) {
  return held.has(button);
}

/** True only on the frame the button went down. Call endFrame() after each update. */
function wasPressed(button) {
  return pressedThisFrame.has(button);
}

function endFrame() {
  pressedThisFrame.clear();
}

// ---- web/src/pixelfont.js ------------------------------------------
// The game's own lettering, for the bits of the phone build that need words.
//
// The DS has no text on its main screen, so every name that floats over a
// character is a picture drawn at build time by tools/make_nametags.py from a
// 5x7 bitmap font written out by hand. The phone build needs words the DS
// never does — a title, a menu you can tap — and setting those in a system
// typeface would put lettering on screen that exists nowhere else in the game.
//
// So it uses the same font. tools/make_nametags.py writes the glyph table to
// content/font.json alongside the sprite sheet, which keeps one definition of
// the letters rather than two that slowly disagree.



let table = null;

async function loadFont() {
  if (!table) table = await loadJSON('content/font.json');
  return table;
}

function glyphFor(font, ch) {
  const rows = font.glyphs[ch] ?? font.glyphs[ch.toUpperCase()] ?? font.glyphs[' '];
  const width = Math.max(...rows.map((r) => r.length));
  return rows.map((r) => r.padEnd(width, '.'));
}

/** Width of a string in font pixels, before any scaling. */
function measureText(font, text) {
  let width = 0;
  for (const ch of text) width += glyphFor(font, ch)[0].length + font.kern;
  return Math.max(0, width - font.kern);
}

/**
 * Draw one line into a canvas, resizing it to fit exactly.
 *
 * `scale` is whole pixels per font pixel — never fractional, or the letters
 * come out with one row of a stem thicker than the next, which is the one
 * thing a bitmap font must not do. `shadow` drops a hard offset copy behind
 * the text, the way the name plates carry an outline.
 */
function drawText(canvas, font, text, { scale = 3, colour = '#ECECE8',
                                               shadow = null } = {}) {
  const width = measureText(font, text);
  const drop = shadow ? 1 : 0;

  canvas.width = (width + drop) * scale;
  canvas.height = (font.cellHeight + drop) * scale;
  canvas.style.width = `${canvas.width}px`;
  canvas.style.height = `${canvas.height}px`;

  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  for (const pass of shadow ? [shadow, colour] : [colour]) {
    const offset = pass === colour ? 0 : drop;
    ctx.fillStyle = pass;
    let x = offset;
    for (const ch of text) {
      const rows = glyphFor(font, ch);
      rows.forEach((row, y) => {
        [...row].forEach((on, dx) => {
          if (on === '#') {
            ctx.fillRect((x + dx) * scale, (y + offset) * scale, scale, scale);
          }
        });
      });
      x += rows[0].length + font.kern;
    }
  }
  return canvas;
}

/** Replace an element's contents with one line of game lettering. */
function setText(element, font, text, options) {
  if (element.dataset.text === text && element.firstChild) return;
  element.dataset.text = text;
  const canvas = element.ownerDocument.createElement('canvas');
  drawText(canvas, font, text, options);
  element.replaceChildren(canvas);
}

// ---- web/src/game.js -----------------------------------------------
// The game itself, with no idea what it is being drawn on.
//
// Nothing here touches a canvas, a DOM node or a key code. Two front ends use
// it: web/src/main.js, the dual-screen desktop preview, and web/src/play.js,
// the phone build. Both feed it the same DS button set and both draw it with
// web/src/render.js, so a rule can only ever be implemented once.
//
// The DS runs its own copy of these rules in source/main.c. Where the two
// disagree, the DS wins — see CLAUDE.md.








const SCREEN_W = 256;
const SCREEN_H = 192;

// The DS runs at 60Hz. Both browser builds step at exactly that rate whatever
// the display is doing, so tuning done on one carries to the others.
const FRAME_MS = 1000 / 60;

// How close Maia must be to a vehicle before she can get in.
const INTERACT_REACH = 6;

// She farts every five seconds. 60Hz steps, so 300 of them.
const FART_EVERY = 300;
const FART_TICKS_PER_FRAME = 5;

// Where the puff sits relative to the middle of whoever let it go: behind
// them, which depends on which way they are facing.
const FART_OFFSET = {
  down: [0, -7], up: [0, 3], left: [12, -3], right: [-12, -3],
};

// Watering the garden: how long one go lasts, and how long each of the two
// drawings is held. Long enough to read as an action rather than a twitch.
const WATER_LENGTH = 160;
const WATER_TICKS_PER_FRAME = 12;
const WATER_SPRITE = 'maia-watering';

function clampTo(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

/** The nearest vehicle Maia is standing close enough to use. */
function vehicleInReach(player, actors, sheets) {
  const reach = inflate(actorBox(player, sheets), INTERACT_REACH);
  return actors.find((a) => a.behavior === 'vehicle'
                         && boxesOverlap(reach, actorBox(a, sheets))) ?? null;
}

/** Find somewhere clear beside the car to step out onto. */
function dropOffSpot(vehicle, player, map, sheets, actors) {
  const vb = actorBox(vehicle, sheets);
  const pb = sheets[player.sprite].collisionBox;
  const gap = 3;
  const candidates = [
    [vb.x - pb.width - gap - pb.x, vb.y + vb.height - pb.height - pb.y],
    [vb.x + vb.width + gap - pb.x, vb.y + vb.height - pb.height - pb.y],
    [vb.x + vb.width / 2 - pb.x - pb.width / 2, vb.y + vb.height + gap - pb.y],
    [vb.x + vb.width / 2 - pb.x - pb.width / 2, vb.y - pb.height - gap - pb.y],
  ];
  for (const [x, y] of candidates) {
    // The car itself must still block, or she can step out inside it.
    const box = actorBox(player, sheets, x, y);
    if (canStand(map, sheets, box, actors, [player])) return { x, y };
  }
  return null;
}

/**
 * The list of places on offer right now, and what the first row of it says.
 *
 * What she is sitting on decides the list. A car goes anywhere that has a road
 * to arrive on; the bike goes to Leo's street and nowhere else; on foot she can
 * take herself to her own front path or to Leo's street, and that is all. The
 * place she is already standing on is never offered.
 *
 * Returns null when there is nothing to offer, which is what the phone's
 * buttons ask before deciding whether X does anything.
 */
function destinationsFor(state) {
  const source = state.riding
    ? state.travel.riders[state.riding.parkedSprite]
    : state.travel.onFoot;
  if (!source) return null;

  const items = (source.places ?? [])
    .map((id) => state.travel.byId[id])
    .filter((place) => place && place.map !== state.map.id);
  return items.length ? { stay: source.stay, items } : null;
}

/** Is there anywhere to go from here? */
function canTravel(state) {
  return Boolean(destinationsFor(state));
}

/**
 * The fart.
 *
 * Every five seconds, whatever she happens to be doing. Runs on the same fixed
 * 60Hz step as everything else, so it keeps time with the DS rather than with
 * the display.
 */
function updateFart(state) {
  const fart = state.fart;
  if (fart.frame >= 0) {
    if (++fart.tick >= FART_TICKS_PER_FRAME) {
      fart.tick = 0;
      if (++fart.frame >= state.sheets.fart.frameOrder.length) fart.frame = -1;
    }
    return;
  }
  if (--fart.timer <= 0) {
    fart.frame = 0;
    fart.tick = 0;
    fart.timer = FART_EVERY;
  }
}

/**
 * The raised bed, if she is standing close enough to reach into it.
 *
 * A map either has a garden or it does not; only her backyard does. Returned
 * in pixels, because everything that touches it after this is in pixels.
 */
function gardenInReach(state) {
  const g = state.map.garden;
  if (!g || state.riding) return null;
  const t = state.map.tileSize;
  const rect = { x: g.x * t, y: g.y * t, width: g.width * t, height: g.height * t };
  const reach = inflate(actorBox(state.player, state.sheets), INTERACT_REACH);
  return boxesOverlap(reach, rect) ? rect : null;
}

/**
 * Start watering.
 *
 * There is one drawing of her doing it and it faces left, so which way she
 * ends up pointing is decided by which side of the bed she is standing on
 * rather than by which way she walked up — water has to fall on the plants.
 */
function startWatering(state, rect) {
  const box = actorBox(state.player, state.sheets);
  const mirror = box.x + box.width / 2 < rect.x + rect.width / 2;
  state.player.facing = mirror ? 'right' : 'left';
  state.player.moving = false;
  state.watering = { left: WATER_LENGTH, tick: 0, frame: 0, mirror };
}

/** One frame of watering. Everything else in the world is put on hold. */
function updateWatering(state) {
  const w = state.watering;
  if (++w.tick >= WATER_TICKS_PER_FRAME) {
    w.tick = 0;
    w.frame = (w.frame + 1) % state.sheets[WATER_SPRITE].frameOrder.length;
  }
  if (--w.left <= 0) state.watering = null;
}

/**
 * The transition the given actor is standing on, if any.
 *
 * Transitions have to be armed: you arrive standing on the doormat, so the
 * door is dead until you have stepped off it once. Otherwise walking through
 * the front door would bounce you straight back out again.
 */
function triggeredBy(state, list, actor) {
  const box = actorBox(actor, state.sheets);
  const hit = (list ?? []).find((t) => inRects(state.map, [t], box)) ?? null;
  if (!hit) state.armed = true;
  return state.armed ? hit : null;
}

/** Put the list of places on screen. */
function openMenu(state) {
  const offer = destinationsFor(state);
  if (offer) state.menu = { stay: offer.stay, items: offer.items, index: 0 };
}

/**
 * Get on or into a vehicle.
 *
 * Some vehicles are ridden rather than sat inside, and those carry a second
 * sprite with Maia on them — you can see her on a motorbike, so a bike with
 * nobody on it and a bike with her on it are two different pictures. Swapping
 * `sprite` is all it takes here; source/main.c has to shuffle sprite memory to
 * do the same thing.
 */
function mount(state, vehicle) {
  state.player.hidden = true;
  state.riding = vehicle;
  state.nearVehicle = null;
  if (vehicle.riddenSprite) vehicle.sprite = vehicle.riddenSprite;
  state.armed = false;   // don't set off and immediately park
}

function dismount(state) {
  const vehicle = state.riding;
  if (vehicle.parkedSprite) vehicle.sprite = vehicle.parkedSprite;
  vehicle.moving = false;
  state.riding = null;
}

/** Everything a vehicle needs to be put back where it was left. */
function rememberVehicle(state, actor, mapId) {
  const record = state.vehicles[actor.parkedSprite];
  if (!record) return;
  record.map = mapId;
  record.x = actor.x;
  record.y = actor.y;
  record.facing = actor.facing;
}

function update(state) {
  const { map, sheets, actors, player } = state;

  // The destination list freezes the world while it is up.
  if (state.menu) {
    const menu = state.menu;
    const last = menu.items.length;
    if (wasPressed('up')) menu.index = menu.index > 0 ? menu.index - 1 : last;
    if (wasPressed('down')) menu.index = menu.index < last ? menu.index + 1 : 0;
    if (wasPressed('b') || wasPressed('x')) state.menu = null;
    if (wasPressed('a')) {
      const choice = menu.index > 0 ? menu.items[menu.index - 1] : null;
      state.menu = null;
      if (!choice) return null;
      // On a vehicle the vehicle comes too, and she arrives still on it. On
      // foot she simply turns up, on the tile the place names for walkers.
      if (state.riding) {
        return {
          kind: 'travel', to: choice.map,
          arrive: { ...choice.arrive, vehicle: state.riding.parkedSprite },
        };
      }
      return {
        kind: 'door', to: choice.map,
        spawn: choice.onFoot, facing: choice.onFoot.facing,
      };
    }
    return null;
  }

  // Watering is an animation she is committed to, not a pose. Nothing moves
  // until she has finished — including her.
  if (state.watering) {
    updateWatering(state);
    updateFart(state);
    return null;
  }

  let dx = 0;
  let dy = 0;
  if (isHeld('left')) dx -= 1;
  if (isHeld('right')) dx += 1;
  if (isHeld('up')) dy -= 1;
  if (isHeld('down')) dy += 1;

  const subject = state.riding ?? player;

  if (dx < 0) subject.facing = 'left';
  else if (dx > 0) subject.facing = 'right';
  else if (dy < 0) subject.facing = 'up';
  else if (dy > 0) subject.facing = 'down';

  const moving = dx !== 0 || dy !== 0;
  subject.moving = moving;

  if (moving) {
    const diagonal = dx !== 0 && dy !== 0;
    const speed = state.riding
      ? (diagonal ? DRIVE_SPEED * Math.SQRT1_2 : DRIVE_SPEED)
      : (diagonal ? DIAG_SPEED : WALK_SPEED);
    // Whoever is being driven should not collide with itself, and the hidden
    // passenger should not block either.
    moveActor(subject, dx, dy, speed, map, sheets, actors, [subject, player],
              Boolean(state.riding));
    advanceAnimation(subject, sheets,
                     state.riding ? DRIVE_TICKS_PER_STEP : TICKS_PER_STEP);
  } else {
    subject.tick = 0;
    subject.cyclePos = 0;
  }

  // There is nowhere to ride to inside a garage: setting off at all means
  // going out. Checked before anything else can interrupt, so the first
  // nudge of the pad is what takes her out of the door.
  if (state.riding && moving && map.rideOut) {
    return {
      kind: 'travel',
      to: map.rideOut.to,
      arrive: { ...map.rideOut.arrive, vehicle: state.riding.parkedSprite },
    };
  }

  // Riding onto a doorway that takes the vehicle through with you: the
  // garage. Arriving is parking, so she comes off the bike on the far side —
  // otherwise the first nudge inside would ride her straight back out.
  if (state.riding && state.armed) {
    const gate = (map.rideIn ?? []).find(
      (t) => (!t.vehicle || t.vehicle === state.riding.parkedSprite)
          && inRects(map, [t], actorBox(state.riding, sheets)));
    if (gate) {
      return {
        kind: 'travel', to: gate.to, spawn: gate.spawn, facing: gate.facing,
        arrive: { ...gate.arrive, vehicle: state.riding.parkedSprite, park: true },
      };
    }
  }

  // Pets get on with their own business regardless.
  for (const actor of actors) {
    if (actor.behavior === 'wander') updateWander(actor, map, sheets, actors);
  }

  updateFart(state);

  state.nearVehicle = state.riding ? null : vehicleInReach(player, actors, sheets);
  state.nearGarden = state.nearVehicle ? null : gardenInReach(state);

  if (wasPressed('a')) {
    if (state.riding) {
      const spot = dropOffSpot(state.riding, player, map, sheets, actors);
      if (spot) {
        player.x = spot.x;
        player.y = spot.y;
        player.hidden = false;
        player.moving = false;
        dismount(state);
      }
    } else if (state.nearGarden) {
      startWatering(state, state.nearGarden);
      return null;
    } else if (state.nearVehicle) {
      mount(state, state.nearVehicle);
      // Getting in is when you decide where you are going — but only for a
      // vehicle that has anywhere to go.
      if (canTravel(state)) openMenu(state);
      return null;
    }
  } else if (wasPressed('x') && canTravel(state)) {
    // Halfway down the road, or halfway across a lawn. On foot this is the
    // only way to get somewhere without walking the whole way.
    openMenu(state);
    return null;
  }

  // B outside a menu is a development tool, not a game control. The phone
  // build turns it off, so B there only ever means "never mind".
  if (wasPressed('b') && state.debugToggle) state.debug = !state.debug;

  // Wherever each vehicle ended up this frame is where it stays, so walking
  // indoors and out again finds it unmoved. Mirrors source/main.c.
  for (const actor of actors) {
    if (actor.behavior === 'vehicle') rememberVehicle(state, actor, map.id);
  }

  // On foot, walking onto a doorstep goes inside. Parking does not: no map
  // declares a park spot any more, but the machinery stays.
  const door = state.riding
    ? triggeredBy(state, map.parkSpots, state.riding)
    : triggeredBy(state, map.exits, player);
  return door ? { kind: 'door', to: door.to, spawn: door.spawn, facing: door.facing }
              : null;
}

function updateCamera(state) {
  const { map, sheets, cam } = state;
  const subject = state.riding ?? state.player;
  const meta = sheets[subject.sprite];
  const mapW = map.width * map.tileSize;
  const mapH = map.height * map.tileSize;

  // Centre on whoever the player is controlling, then keep the view inside the
  // map. Maps smaller than the screen just sit at the origin.
  cam.x = clampTo(subject.x + meta.frameWidth / 2 - SCREEN_W / 2,
                  0, Math.max(0, mapW - SCREEN_W));
  cam.y = clampTo(subject.y + meta.frameHeight / 2 - SCREEN_H / 2,
                  0, Math.max(0, mapH - SCREEN_H));
}

async function ensureSheet(state, category, sprite) {
  if (!state.sheets[sprite]) {
    const meta = await loadJSON(`content/${category}/${sprite}.json`);
    state.sheets[sprite] = meta;
    state.images[sprite] = await loadImage(meta.sheet);
  }
  return state.sheets[sprite];
}

/**
 * Take each vehicle's starting position from whichever map lists it, once.
 *
 * After that it is wherever it was last left, which is not a map's business:
 * Frankie belongs to Maia and travels with her, and Gisella's bike stays where
 * it was ridden to. Mirrors note_vehicle_starts() in source/main.c.
 */
function noteVehicleStarts(state, map) {
  for (const o of map.objects ?? []) {
    if (o.behavior !== 'vehicle' || state.vehicles[o.sprite]) continue;
    state.vehicles[o.sprite] = {
      sprite: o.sprite,
      ridden: o.ridden ?? null,
      category: o.category,
      map: map.id,
      x: o.x,
      y: o.y,
      facing: (o.frame ?? 'down_parked').split('_')[0],
    };
  }
}

/** Put a vehicle on the map, in whichever of its two forms is wanted. */
async function spawnVehicle(state, record, riding) {
  const parkedMeta = await ensureSheet(state, record.category, record.sprite);
  if (record.ridden) await ensureSheet(state, record.category, record.ridden);

  const spriteNow = riding && record.ridden ? record.ridden : record.sprite;
  const meta = state.sheets[spriteNow];
  const actor = makeActor({
    id: record.sprite, sprite: spriteNow, category: record.category,
    x: record.x, y: record.y, solid: true, behavior: 'vehicle',
    frame: `${record.facing}_${meta.poses[0]}`,
  }, state.sheets);
  // Which sheet is which, so mounting and getting off can swap between them.
  actor.parkedSprite = record.sprite;
  actor.riddenSprite = record.ridden;
  void parkedMeta;
  state.actors.push(actor);
  return actor;
}

/**
 * Swap in a different map: load it, load whatever art it needs that we do not
 * already have, and put the player down at `spawn`.
 *
 * `arrive` means she is driving here rather than walking: the car is moved to
 * that tile and she stays in the driving seat on the far side.
 *
 * Sheets and images accumulate rather than being thrown away, because the
 * browser caches them anyway and walking in and out of a front door should not
 * flicker. The DS has to be stricter — see load_map() in source/main.c.
 */
async function enterMap(state, id, spawn, facing = 'down', arrive = null) {
  const map = await prepareMap(await loadJSON(`content/maps/${id}.json`), loadJSON);

  for (const obj of map.objects ?? []) await ensureSheet(state, obj.category, obj.sprite);
  if (map.garden) await ensureSheet(state, 'characters', WATER_SPRITE);
  if (!state.tilesets[map.tileset]) {
    state.tilesets[map.tileset] =
      await loadImage(`assets/game/tilesets/${map.tileset}.png`);
  }

  noteVehicleStarts(state, map);

  // 'arrive' means she rode here. Move that vehicle to the arrival tile before
  // anything is placed, so it is simply one of the vehicles parked on this map.
  const arriving = arrive ? state.vehicles[arrive.vehicle] : null;
  if (arriving) {
    // The tile named is where the vehicle's footprint lands, not its sprite:
    // most of a 64x64 frame is empty air above the roof.
    const meta = await ensureSheet(state, arriving.category, arriving.sprite);
    const box = meta.collisionBox;
    arriving.map = id;
    arriving.x = arrive.x * map.tileSize - box.x;
    arriving.y = arrive.y * map.tileSize - box.y;
    arriving.facing = arrive.facing;
  }

  const at = spawn ?? map.spawn;
  const meta = state.sheets.maia;
  state.map = map;
  state.tileset = state.tilesets[map.tileset];
  // Spawn names the tile her feet stand on, so lift the taller sprite up.
  state.player.x = at.x * map.tileSize;
  state.player.y = at.y * map.tileSize - (meta.frameHeight - map.tileSize);
  state.player.facing = facing;
  state.player.moving = false;
  state.player.hidden = false;
  // Vehicles are placed from their own records below, wherever they were left.
  state.actors = [
    state.player,
    ...(map.objects ?? []).filter((o) => o.behavior !== 'vehicle')
      .map((o) => makeActor(o, state.sheets)),
  ];
  state.riding = null;
  state.nearVehicle = null;
  state.nearGarden = null;
  state.watering = null;

  for (const record of Object.values(state.vehicles)) {
    if (record.map !== id) continue;
    // 'park' means she rode here and this is the end of the journey — into the
    // garage. The vehicle comes with her, but she gets off it on arrival.
    const onIt = record === arriving && !arrive.park;
    const actor = await spawnVehicle(state, record, onIt);
    if (onIt) {
      // Arriving on foot beside something she was riding would be an odd way
      // to end a journey, so she stays on it.
      state.riding = actor;
      state.player.hidden = true;
      state.player.x = actor.x;
      state.player.y = actor.y;
    }
  }

  // Whatever brought her here, she is standing on it. Don't fire it again.
  state.armed = false;
  updateCamera(state);
}

/**
 * Everything the game needs, loaded and standing on the first map.
 * `startMap` is only for authoring — the game proper always begins at home.
 */
async function createGame(startMap = 'forest-fountain',
                                 { debugToggle = true } = {}) {
  // Absent destinations file means nowhere to go but on foot, which is a valid
  // state while a world is being built.
  const file = await loadJSON('content/destinations.json').catch(() => ({}));
  const places = file.places ?? [];
  const travel = {
    byId: Object.fromEntries(places.map((p) => [p.id, p])),
    riders: file.riders ?? {},
    onFoot: file.onFoot ?? null,
  };

  // Map labels are set in the game's own lettering, from the same table the
  // name plates are drawn from.
  const font = await loadFont();

  const nametags = await loadJSON('content/nametags.json');
  nametags.bySprite = Object.fromEntries(nametags.tags.map((t) => [t.sprite, t]));

  const maiaMeta = await loadJSON('content/characters/maia.json');
  const fartMeta = await loadJSON('content/effects/fart.json');
  const sheets = { maia: maiaMeta, fart: fartMeta };
  const player = makeActor({
    id: 'player', sprite: 'maia', category: 'characters',
    x: 0, y: 0, frame: 'down_idle', solid: true,
  }, sheets);
  player.isPlayer = true;

  const state = {
    map: null,
    sheets,
    nametags,
    font,
    images: {
      maia: await loadImage(maiaMeta.sheet),
      fart: await loadImage(fartMeta.sheet),
      __nametags: await loadImage(nametags.sheet),
    },
    tilesets: {},
    tileset: null,
    player,
    actors: [player],
    riding: null,
    nearVehicle: null,
    // The raised bed she is close enough to water, and the go she is having.
    nearGarden: null,
    watering: null,
    travel,
    menu: null,
    // Every vehicle is wherever it was last left, not part of any one map.
    vehicles: {},
    // frame -1 means no puff on screen; the timer counts down to the next.
    fart: { timer: FART_EVERY, frame: -1, tick: 0 },
    armed: false,
    cam: { x: 0, y: 0 },
    debug: false,
    debugToggle,
    busy: false,
    accumulator: 0,
  };

  await enterMap(state, startMap, null);
  return state;
}

/**
 * Run the world forward by however long the display took, in fixed 60Hz steps.
 *
 * Loading the next map is asynchronous in the browser, so simulation stops
 * while it arrives rather than running the old map under the player's feet.
 */
function stepGame(state, elapsedMs) {
  state.accumulator += Math.min(elapsedMs, 250);

  while (state.accumulator >= FRAME_MS) {
    const going = state.busy ? null : update(state);
    endFrame();
    state.accumulator -= FRAME_MS;
    if (going) {
      state.busy = true;
      enterMap(state, going.to, going.spawn, going.facing, going.arrive ?? null)
        .then(() => { state.busy = false; })
        .catch((err) => console.error(err));
      break;
    }
  }
  updateCamera(state);
}

// ---- web/src/render.js ---------------------------------------------
// Drawing the world onto a 256x192 Canvas 2D surface.
//
// Shared by the desktop preview and the phone build, because both are canvases
// — this is not the DS renderer and never becomes one. The DS draws the same
// world with hardware tilemaps and sprites in source/main.c; only the *rules*
// are common between the two, never the drawing code. See CLAUDE.md.






// Label canvases, drawn once and kept. A label never changes, and redrawing
// letters a pixel at a time sixty times a second would be daft.
const labels = new Map();

function drawMap(ctx, map, tileset, cam) {
  const t = map.tileSize;
  // A map can be smaller than the screen — an interior is one room — so paint
  // the border tile everywhere first and let the map sit on top of it. The DS
  // does the same thing by filling its whole background map.
  const border = map.borderTile ?? 0;
  for (let y = 0; y < SCREEN_H; y += t) {
    for (let x = 0; x < SCREEN_W; x += t) {
      ctx.drawImage(tileset, 0, border * t, t, t, x, y, t, t);
    }
  }

  // Only touch tiles that are actually on screen.
  const x0 = Math.max(0, Math.floor(cam.x / t));
  const y0 = Math.max(0, Math.floor(cam.y / t));
  const x1 = Math.min(map.width - 1, Math.floor((cam.x + SCREEN_W) / t));
  const y1 = Math.min(map.height - 1, Math.floor((cam.y + SCREEN_H) / t));

  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      ctx.drawImage(tileset, 0, map.tiles[y][x] * t, t, t,
                    x * t - cam.x, y * t - cam.y, t, t);
    }
  }
}

function drawActor(ctx, actor, sheets, images, cam) {
  const meta = sheets[actor.sprite];
  const index = meta.frameOrder.indexOf(frameNameFor(actor, sheets));
  ctx.drawImage(
    images[actor.sprite],
    0, Math.max(0, index) * meta.frameHeight, meta.frameWidth, meta.frameHeight,
    Math.round(actor.x - cam.x), Math.round(actor.y - cam.y),
    meta.frameWidth, meta.frameHeight,
  );
}

/**
 * The name plate that floats above a character.
 *
 * Drawn from the same sheet the DS uses rather than with canvas text, so the
 * two platforms show the identical picture. Plates are drawn after every
 * actor, so a name is never hidden behind whoever is standing in front of it —
 * the DS gets the same result by giving them the lower OAM indices.
 */
function drawNameTag(ctx, actor, state, cam) {
  const { nametags, sheets } = state;
  const tag = nametags.bySprite[actor.sprite];
  if (!tag) return;

  const meta = sheets[actor.sprite];
  const { frameWidth: w, frameHeight: h } = nametags;
  ctx.drawImage(
    state.images.__nametags,
    0, tag.frame * h, w, h,
    Math.round(actor.x) + meta.frameWidth / 2 - w / 2 - Math.round(cam.x),
    Math.round(actor.y) + tag.offsetY - Math.round(cam.y),
    w, h,
  );
}

/**
 * Maia watering the garden, in place of Maia standing there.
 *
 * There is one drawing and it faces left, so half the time it is flipped. Her
 * feet land where they would if she were just standing, because the frames
 * were cut to the same height as the rest of her sheet.
 */
function drawWatering(ctx, state, cam) {
  const { watering } = state;
  const meta = state.sheets[WATER_SPRITE];
  const x = Math.round(state.player.x - cam.x);
  const y = Math.round(state.player.y - cam.y);

  ctx.save();
  if (watering.mirror) {
    ctx.translate(x + meta.frameWidth, y);
    ctx.scale(-1, 1);
  } else {
    ctx.translate(x, y);
  }
  ctx.drawImage(state.images[WATER_SPRITE],
                0, watering.frame * meta.frameHeight,
                meta.frameWidth, meta.frameHeight,
                0, 0, meta.frameWidth, meta.frameHeight);
  ctx.restore();
}

/**
 * Words painted over the map — a sign on a door, in effect.
 *
 * Set in the game's own bitmap lettering rather than in a browser typeface, so
 * a label looks like it belongs to the same world as the names over people's
 * heads. Drawn last, over everything, because a sign you cannot read is not a
 * sign.
 */
function drawLabels(ctx, state, cam) {
  const { map, font } = state;
  if (!font) return;
  const t = map.tileSize;

  for (const label of map.labels ?? []) {
    let canvas = labels.get(label.text);
    if (!canvas) {
      canvas = drawText(ctx.canvas.ownerDocument.createElement('canvas'),
                        font, label.text,
                        { scale: 1, colour: '#F2EFE6', shadow: '#16120E' });
      labels.set(label.text, canvas);
    }
    ctx.drawImage(canvas,
                  Math.round((label.x + 0.5) * t - canvas.width / 2 - cam.x),
                  Math.round(label.y * t - canvas.height - 1 - cam.y));
  }
}

function drawDebug(ctx, map, sheets, actors, cam) {
  const t = map.tileSize;
  ctx.strokeStyle = 'rgba(255,80,80,0.9)';
  ctx.lineWidth = 1;
  for (let y = 0; y < map.height; y++) {
    for (let x = 0; x < map.width; x++) {
      if (!map.solidGrid[y][x]) continue;
      const sx = x * t - cam.x;
      const sy = y * t - cam.y;
      if (sx < -t || sy < -t || sx > SCREEN_W || sy > SCREEN_H) continue;
      ctx.strokeRect(sx + 0.5, sy + 0.5, t - 1, t - 1);
    }
  }
  // Where the car may go, and where standing means going somewhere else.
  for (const [rects, colour] of [[map.driveZones, 'rgba(120,200,255,0.9)'],
                                 [map.parkSpots, 'rgba(255,240,120,1)'],
                                 [map.exits, 'rgba(160,255,160,1)']]) {
    ctx.strokeStyle = colour;
    for (const r of rects ?? []) {
      ctx.strokeRect(r.x * t - cam.x + 1.5, r.y * t - cam.y + 1.5,
                     r.width * t - 3, r.height * t - 3);
    }
  }
  for (const actor of actors) {
    if (actor.hidden) continue;
    const b = actorBox(actor, sheets);
    ctx.strokeStyle = actor.isPlayer ? 'rgba(90,220,255,1)' : 'rgba(255,180,60,0.95)';
    ctx.strokeRect(b.x - cam.x + 0.5, b.y - cam.y + 0.5, b.width - 1, b.height - 1);
  }
}

/**
 * The fart.
 *
 * Drawn behind whoever is being controlled — on foot that is Maia, on the bike
 * it is the bike, and in the car it comes out somewhere near the exhaust,
 * which is funnier than suppressing it. The artwork blows to the right, so it
 * is mirrored when she faces right and the gas should be going the other way.
 */
function drawFart(ctx, state, cam) {
  const { fart, sheets } = state;
  if (fart.frame < 0) return;

  const subject = state.riding ?? state.player;
  if (subject.hidden) return;

  const meta = sheets.fart;
  const body = sheets[subject.sprite];
  const [ox, oy] = FART_OFFSET[subject.facing] ?? FART_OFFSET.down;

  const x = Math.round(subject.x - cam.x) + body.frameWidth / 2
          - meta.frameWidth / 2 + ox;
  // Sit it at knee height rather than at the top of the frame, which for a
  // 64px vehicle sprite is mostly empty air.
  const y = Math.round(subject.y - cam.y) + body.frameHeight
          - meta.frameHeight + oy;

  const flip = subject.facing === 'right';
  ctx.save();
  if (flip) {
    ctx.translate(x + meta.frameWidth, y);
    ctx.scale(-1, 1);
  } else {
    ctx.translate(x, y);
  }
  ctx.drawImage(state.images.fart,
                0, fart.frame * meta.frameHeight, meta.frameWidth, meta.frameHeight,
                0, 0, meta.frameWidth, meta.frameHeight);
  ctx.restore();
}

/** One frame of the world: ground, everyone standing on it, and their names. */
function drawWorld(ctx, state) {
  const { map, sheets, tileset, images, cam } = state;
  drawMap(ctx, map, tileset, cam);

  // Depth-sort by the bottom of each collision box, so characters pass behind
  // things further down the screen and in front of things above.
  const visible = state.actors
    .filter((a) => !a.hidden)
    .sort((a, b) => (actorBox(a, sheets).y + actorBox(a, sheets).height)
                  - (actorBox(b, sheets).y + actorBox(b, sheets).height));

  visible.forEach((a) => {
    if (a.isPlayer && state.watering) drawWatering(ctx, state, cam);
    else drawActor(ctx, a, sheets, images, cam);
  });
  drawFart(ctx, state, cam);
  visible.forEach((a) => drawNameTag(ctx, a, state, cam));
  drawLabels(ctx, state, cam);

  if (state.debug) drawDebug(ctx, map, sheets, state.actors, cam);
}

// ---- web/src/touch.js ----------------------------------------------
// On-screen controls for the phone build.
//
// These do not talk to the game. They press the same DS buttons the keyboard
// presses, through input.js, so there is exactly one path from "the player did
// something" to "the world changed" — a touch build that drifted away from the
// key build would be two games to keep working instead of one.



const DIRECTIONS_HELD = ['up', 'down', 'left', 'right'];

// How far the thumb must travel from where it landed before it counts as a
// direction, and how far out the knob is allowed to slide. A thumb resting on
// glass drifts constantly; without a dead zone Maia twitches on the spot.
const DEAD_ZONE = 10;
const PAD_RANGE = 40;

// A short tick when a button goes down. Phones only; silently absent elsewhere.
function tick(ms) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

/**
 * Which directions a thumb at (dx, dy) from the centre is asking for.
 *
 * Eight-way, in 45-degree sectors, and diagonals genuinely press two buttons —
 * the game already handles that, and the DS d-pad does the same thing.
 */
function directionsFor(dx, dy) {
  const held = new Set();
  if (Math.hypot(dx, dy) < DEAD_ZONE) return held;

  // Sector 0 is due right, counting clockwise in eighths of a turn.
  const sector = Math.round(Math.atan2(dy, dx) / (Math.PI / 4) + 8) % 8;
  if ([7, 0, 1].includes(sector)) held.add('right');
  if ([3, 4, 5].includes(sector)) held.add('left');
  if ([1, 2, 3].includes(sector)) held.add('down');
  if ([5, 6, 7].includes(sector)) held.add('up');
  return held;
}

/**
 * The left thumb pad.
 *
 * The centre is wherever the thumb first lands rather than the middle of the
 * pad, so it works without looking down — put your thumb anywhere in the
 * corner and push. `knob` is moved to show where the pad thinks you are.
 */
function bindPad(pad, knob) {
  let pointer = null;
  let originX = 0;
  let originY = 0;

  const release = () => {
    pointer = null;
    DIRECTIONS_HELD.forEach(releaseButton);
    pad.classList.remove('active');
    knob.style.transform = 'translate(-50%, -50%)';
  };

  const moveTo = (event) => {
    const dx = event.clientX - originX;
    const dy = event.clientY - originY;
    const held = directionsFor(dx, dy);
    for (const dir of DIRECTIONS_HELD) {
      if (held.has(dir)) pressButton(dir);
      else releaseButton(dir);
    }

    const distance = Math.min(Math.hypot(dx, dy), PAD_RANGE);
    const angle = Math.atan2(dy, dx);
    knob.style.transform =
      `translate(calc(-50% + ${Math.cos(angle) * distance}px),`
      + ` calc(-50% + ${Math.sin(angle) * distance}px))`;
  };

  pad.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    pointer = event.pointerId;
    originX = event.clientX;
    originY = event.clientY;
    pad.setPointerCapture(pointer);
    pad.classList.add('active');
    moveTo(event);
  });

  pad.addEventListener('pointermove', (event) => {
    if (event.pointerId !== pointer) return;
    event.preventDefault();
    moveTo(event);
  });

  for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    pad.addEventListener(name, (event) => {
      if (event.pointerId !== pointer) return;
      release();
    });
  }
}

function bindButton(element) {
  const button = element.dataset.button;

  element.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    element.setPointerCapture(event.pointerId);
    element.classList.add('active');
    pressButton(button);
    tick(8);
  });

  for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    element.addEventListener(name, () => {
      element.classList.remove('active');
      releaseButton(button);
    });
  }
}

/**
 * Wire up every control inside `root`: one element with `data-pad`, and any
 * number carrying `data-button="a"` and friends.
 */
function bindTouchControls(root) {
  const pad = root.querySelector('[data-pad]');
  if (pad) bindPad(pad, pad.querySelector('[data-knob]'));
  root.querySelectorAll('[data-button]').forEach(bindButton);
}

/**
 * Press and release a button on the next frame, for taps on things that are
 * not buttons — a menu row, say. The game sees an ordinary A press.
 */
function tapButton(button) {
  pressButton(button);
  requestAnimationFrame(() => requestAnimationFrame(() => releaseButton(button)));
}

// ---- web/src/play.js -----------------------------------------------
// Our Little World — the phone build.
//
// One screen instead of two, thumbs instead of a d-pad, and no development
// readouts. The world itself is web/src/game.js, exactly as the desktop
// preview runs it; this file is only a screen, a pair of controls and the bits
// of chrome a phone needs — fullscreen, orientation, and a menu you can tap.
//
// The DS build is still the authoritative version of the game. This is the
// same world in a second pair of hands, not a replacement for it.







const screen = document.getElementById('screen');
const ctx = screen.getContext('2d');
ctx.imageSmoothingEnabled = false;

const hud = document.getElementById('hud');
const hint = document.getElementById('hint');
const menuBox = document.getElementById('menu');
const menuList = document.getElementById('menu-list');
const rotate = document.getElementById('rotate');
const boot = document.getElementById('boot');
const startButton = document.getElementById('start');
const failure = document.getElementById('failure');

// The game's own lettering, so the chrome is set in the same face as the names
// floating over the characters. Loaded before anything is written.
let font = null;

// Grey-green shadow rather than black: the plates in game carry a dark outline
// and this is the same idea one step softer, so a title does not look stamped.
const SHADOW = '#16181c';

function write(element, text, scale) {
  if (font) setText(element, font, text, { scale, shadow: SHADOW });
}

/**
 * Ask for fullscreen and landscape.
 *
 * Both are best-effort. Android grants them; iOS Safari does neither from a
 * browser tab, which is why there is a "turn your phone sideways" card. Adding
 * the game to the home screen gets it fullscreen on iOS by another route.
 */
async function goFullscreen() {
  try {
    if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
    }
  } catch { /* refused; the game is perfectly playable in a tab */ }

  try {
    await screen.ownerDocument.defaultView.screen?.orientation?.lock?.('landscape');
  } catch { /* not supported, or not allowed outside fullscreen */ }
}

/** Portrait is unplayable — the controls would sit on top of the world. */
function watchOrientation() {
  const portrait = window.matchMedia('(orientation: portrait)');
  const apply = () => {
    // Only nag on something phone-sized. A narrow desktop window is fine.
    const small = Math.min(window.innerWidth, window.innerHeight) < 500;
    const wrong = portrait.matches && small;
    rotate.hidden = !wrong;
    if (wrong) releaseAll();   // don't keep walking behind the card
  };
  portrait.addEventListener('change', apply);
  window.addEventListener('resize', apply);
  apply();
}

/**
 * The destination list, as tappable rows.
 *
 * Tapping a row moves the highlight and presses A, rather than reaching into
 * the game — so a tap and a thumb on the pad go down exactly the same path.
 */
function buildMenu(state) {
  const names = [state.menu.stay, ...state.menu.items.map((d) => d.name)];
  menuList.replaceChildren(...names.map((name, index) => {
    const row = document.createElement('li');
    // The lettering is a canvas, so the name lives on the element itself for
    // screen readers — and for the headless test, which has no eyes either.
    row.dataset.name = name;
    row.setAttribute('aria-label', name);
    row.setAttribute('role', 'button');
    write(row, name, 3);
    row.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      if (!state.menu) return;
      state.menu.index = index;
      syncMenuHighlight(state);
      tapButton('a');
    });
    return row;
  }));
}

function syncMenuHighlight(state) {
  const rows = menuList.children;
  for (let i = 0; i < rows.length; i++) {
    rows[i].classList.toggle('on', state.menu?.index === i);
  }
}

/**
 * Keep the chrome in step with the world: the menu, the prompt, and whether
 * each button currently does anything.
 */
function syncHud(state) {
  const open = Boolean(state.menu);
  if (open && menuBox.hidden) buildMenu(state);
  menuBox.hidden = !open;
  if (open) syncMenuHighlight(state);

  // Whether X does anything is the game's own question, not "is there a list
  // of destinations somewhere" — what she is sitting on decides where she may
  // go, and a button that offered "where to?" and then did nothing was the bug.
  const travel = canTravel(state) && !open && !state.watering;

  let text = '';
  if (state.watering) text = '';
  else if (state.riding && !open) text = travel ? 'A get off    X where to' : 'A get off';
  else if (state.nearVehicle && !open) text = 'A get on';
  else if (state.nearGarden && !open) text = 'A water the garden';
  else if (travel) text = 'X where to';
  hint.hidden = text === '';
  if (text) write(hint, text, 2);

  // Dim rather than hide: a control that moved or disappeared under a thumb
  // already reaching for it would be worse than one that is simply inert.
  const enabled = {
    a: open || state.riding || state.nearVehicle || state.nearGarden,
    b: open,
    x: travel,
  };
  for (const button of hud.querySelectorAll('[data-button]')) {
    button.disabled = !enabled[button.dataset.button];
  }
}

async function play() {
  initInput();                  // a bluetooth keyboard still works
  bindTouchControls(hud);
  watchOrientation();

  font = await loadFont();
  write(document.getElementById('title'), 'OLW', 8);
  write(document.getElementById('rotate-text'), 'Turn your phone sideways', 2);
  write(document.getElementById('menu-title'), 'Where to?', 3);
  write(startButton, 'Loading', 3);
  for (const button of hud.querySelectorAll('[data-button]')) {
    write(button, button.dataset.button.toUpperCase(),
          button.dataset.button === 'a' ? 4 : 3);
  }

  const state = await createGame('forest-fountain', { debugToggle: false });

  startButton.disabled = false;
  write(startButton, 'Play', 3);

  await new Promise((resolve) => {
    startButton.addEventListener('click', async () => {
      await goFullscreen();
      boot.hidden = true;
      resolve();
    }, { once: true });
  });

  let previous = performance.now();

  function frame(now) {
    stepGame(state, now - previous);
    previous = now;

    drawWorld(ctx, state);
    syncHud(state);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// Losing focus — a call, a notification, the app switcher — must not leave her
// walking into a wall until you come back.
window.addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) releaseAll();
});

startButton.disabled = true;

play().catch((err) => {
  boot.hidden = true;
  failure.hidden = false;
  failure.textContent = String(err.message ?? err);
  console.error(err);
});
</script>

</body>
</html>
